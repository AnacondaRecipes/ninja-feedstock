{% set version = "1.13.2" %}
{% set build_number = "0" %}

package:
  name: ninja-suite
  version: {{ version }}

source:
  fn: v{{ version }}.tar.gz
  url: https://github.com/ninja-build/ninja/archive/v{{ version }}.tar.gz
  sha256: 974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17

build:
  number: 0

outputs:
  - name: ninja-base
    script: build-ninja.sh  # [unix]
    script: bld-ninja.bat  # [win]
    build:
      ignore_run_exports:
        - vc
    requirements:
      build:
        - {{ stdlib("c") }}
        - {{ compiler("cxx") }}
        - cmake
        - make  # [not win]
        - gtest
    test:
      commands:
        - ninja --version
  - name: ninja
    requirements:
      run:
        - {{ pin_subpackage('ninja-base', exact=True) }}
        - python

about:
  home: https://ninja-build.org/
  license: Apache-2.0
  license_family: Apache
  license_file: COPYING
  summary: A small build system with a focus on speed
  dev_url: https://github.com/ninja-build/ninja
  doc_url: https://ninja-build.org/manual.html
  description: A small build system with a focus on speed

extra:
  recipe-maintainers:
    - frol
